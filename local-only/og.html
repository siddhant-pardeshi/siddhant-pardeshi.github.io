<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #0d0e11; font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; color: #F2EFE6; overflow: hidden; position: relative; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(124,133,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(124,133,255,0.07) 1px, transparent 1px); background-size: 46px 46px; }
  .glow1 { position: absolute; width: 420px; height: 420px; right: -120px; top: -140px; background: radial-gradient(circle, rgba(217,255,67,0.16), transparent 70%); }
  .glow2 { position: absolute; width: 380px; height: 380px; left: -100px; bottom: -160px; background: radial-gradient(circle, rgba(124,133,255,0.14), transparent 70%); }
  .mono { position: absolute; left: 64px; top: 56px; width: 54px; height: 54px; background: #101114; border: 2.5px solid #D9FF43; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #D9FF43; box-shadow: 4px 4px 0 rgba(217,255,67,0.4); }
  .name { position: absolute; left: 136px; top: 66px; font-weight: 700; font-size: 26px; }
  .role { position: absolute; left: 64px; top: 150px; font-size: 21px; color: #A9ADB9; letter-spacing: 0.06em; }
  .headline { position: absolute; left: 64px; top: 210px; font-size: 64px; font-weight: 700; line-height: 1.12; max-width: 960px; }
  .headline .feel { color: #7C85FF; }
  .underline { position: absolute; left: 64px; top: 470px; width: 210px; height: 7px; background: #D9FF43; border-radius: 6px; transform: rotate(-1.2deg); }
  .sub { position: absolute; left: 64px; top: 502px; font-size: 24px; color: #A9ADB9; }
  .sub b { color: #D9FF43; font-weight: 700; }
  .chips { position: absolute; right: 64px; top: 56px; display: flex; gap: 10px; }
  .chip { font-size: 16px; font-weight: 700; border: 2px solid #2a2c35; border-radius: 999px; padding: 8px 18px; color: #A9ADB9; }
  .chip.hot { background: #D9FF43; color: #101114; border-color: #D9FF43; }
  .rings { position: absolute; right: 150px; top: 180px; }
  .ring { position: absolute; border: 3px dashed rgba(124,133,255,0.5); border-radius: 50%; }
  .r1 { width: 230px; height: 230px; right: 0; top: 0; animation: none; }
  .r2 { width: 150px; height: 150px; right: 40px; top: 40px; border-color: rgba(217,255,67,0.55); }
  .r3 { width: 80px; height: 80px; right: 76px; top: 76px; border-color: rgba(255,168,107,0.6); }
</style></head>
<body>
  <div class="grid"></div><div class="glow1"></div><div class="glow2"></div>
  <div class="mono">SP</div><div class="name">Siddhant Pardeshi</div>
  <div class="chips"><span class="chip">Java</span><span class="chip">Spring Boot</span><span class="chip">React</span><span class="chip hot">77/77 tested</span></div>
  <div class="rings"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div>
  <div class="role">SOFTWARE DEVELOPER · PUNE, INDIA</div>
  <div class="headline">I build the logic.<br>You <span class="feel">feel</span> the experience.</div>
  <div class="underline"></div>
  <div class="sub">The Builder's Playground — <b>playable projects</b> · a <b>15-emotion capybara</b> · <b>hand-tracked particles</b></div>
</body></html>
