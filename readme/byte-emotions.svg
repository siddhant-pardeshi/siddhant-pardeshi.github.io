<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <style>
    .cell-bg { fill:#17181d; stroke:#2a2c35; }
    .lbl { fill:#A9ADB9; font-size:14px; font-weight:600; text-anchor:middle }
    .body { fill:#E9A566; stroke:#101114; stroke-width:3.5; stroke-linejoin:round }
    .ear { fill:#C9814C; stroke:#101114; stroke-width:3 }
    .eye { fill:#101114 } .glint { fill:#fff }
    .disp-b { fill:#101114; stroke:#D9FF43; stroke-width:2.6 } .disp-s { fill:#1d2027 }
    .lime { fill:#D9FF43 } .pk { stroke:#101114; stroke-width:3 } .pawc { fill:#F0B273 }
    .idle-e { animation: blk 3.8s ease-in-out infinite; transform-origin: 46px 88px }
    @keyframes blk { 0%,91%,100% { transform: scaleY(1) } 94% { transform: scaleY(.1) } }
    .wave-p { animation: wv 1.8s ease-in-out infinite; transform-origin: 152px 118px }
    @keyframes wv { 0%,100% { transform: rotate(0) } 35% { transform: rotate(-62deg) } 60% { transform: rotate(-26deg) } }
    .he { animation: hb 1s ease-in-out infinite; transform-origin: center; transform-box: fill-box }
    @keyframes hb { 50% { transform: scale(1.3) } }
    .hf { animation: hf 2.2s ease-out infinite; opacity:0 }
    .hf.b { animation-delay: 1.1s }
    @keyframes hf { 0% { opacity:0; transform: translateY(10px) } 30% { opacity:1 } 100% { opacity:0; transform: translateY(-26px) } }
    .sw { animation: swr 1.2s linear infinite; transform-origin: 46px 88px }
    @keyframes swr { to { transform: rotate(360deg) } }
    .dzb { animation: dz 1s ease-in-out infinite; transform-origin: 100px 140px }
    @keyframes dz { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) } }
    .exc { animation: boing 1.1s ease-in-out infinite; transform-origin: 100px 150px }
    @keyframes boing { 0%,100% { transform: translateY(0) } 35% { transform: translateY(-12px) } 65% { transform: translateY(0) scaleY(.94) } }
    .cf { animation: cf 1.6s ease-out infinite; opacity:0 }
    .cf.c2 { animation-delay:.5s } .cf.c3 { animation-delay:1s }
    @keyframes cf { 0% { opacity:0; transform: translateY(8px) scale(.4) } 30% { opacity:1 } 100% { opacity:0; transform: translateY(-30px) scale(1.1) } }
    .zz { animation: zf 2.4s ease-in-out infinite; opacity:0 }
    .zz.z2 { animation-delay:.8s } .zz.z3 { animation-delay:1.6s }
    @keyframes zf { 0% { opacity:0; transform: translateY(6px) } 30% { opacity:1 } 100% { opacity:0; transform: translateY(-18px) } }
    .dnc { animation: dnc .9s ease-in-out infinite; transform-origin: 100px 145px }
    @keyframes dnc { 0%,100% { transform: rotate(-7deg) } 50% { transform: rotate(7deg) translateY(-8px) } }
    .nt { animation: nt 1.2s ease-out infinite; opacity:0 }
    .nt.n2 { animation-delay:.4s } .nt.n3 { animation-delay:.8s }
    @keyframes nt { 0% { opacity:0; transform: translateY(6px) } 35% { opacity:1 } 100% { opacity:0; transform: translateY(-16px) } }
  </style>

