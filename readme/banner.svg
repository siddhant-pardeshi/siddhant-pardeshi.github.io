<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <clipPath id="bb"><rect x="0" y="0" width="1200" height="376"/></clipPath>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9A566"/><stop offset=".55" stop-color="#C9814C"/><stop offset="1" stop-color="#8a5a33"/>
    </linearGradient>
  </defs>
  <style>
    .tw { animation: tw 3.2s ease-in-out infinite; }
    .tw.d1 { animation-delay: .8s } .tw.d2 { animation-delay: 1.5s } .tw.d3 { animation-delay: 2.2s }
    @keyframes tw { 0%,100% { opacity:.12 } 50% { opacity:.85 } }
    .ring { animation: spin 26s linear infinite; transform-origin: 90px 84px; }
    .ring2 { animation: spin 40s linear infinite reverse; transform-origin: 1128px 60px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .u { stroke-dasharray: 130; stroke-dashoffset: 130; animation: draw 1.6s .6s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .breath { animation: brth 3.6s ease-in-out infinite; transform-origin: 966px 300px; }
    @keyframes brth { 50% { transform: scaleY(1.025) scaleX(.995) } }
    .blink { animation: blk 4s ease-in-out infinite; transform-origin: 928px 208px; }
    @keyframes blk { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.08) } }
    .paw { animation: wv 2.6s ease-in-out infinite; transform-origin: 1006px 262px; }
    @keyframes wv { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-56deg) } 55% { transform: rotate(-24deg) } 75% { transform: rotate(-48deg) } }
    .heart { animation: hrt 3.4s ease-in-out infinite; opacity: 0 }
    @keyframes hrt { 0% { opacity:0; transform: translateY(14px) scale(.5) } 25% { opacity:1 } 55% { opacity:1; transform: translateY(-16px) scale(1.1) } 80%,100% { opacity:0; transform: translateY(-30px) scale(.8) } }
    .disp { animation: disp 2.8s steps(1) infinite; }
    @keyframes disp { 0%,49% { opacity:1 } 50%,100% { opacity:.25 } }
    .tk { animation: tick 16s linear infinite; }
    @keyframes tick { to { transform: translateX(-1250px) } }
    .bob { animation: bob 5.5s ease-in-out infinite; transform-origin: center; }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(1.5deg) } }
    .cheek { animation: chk 3.6s ease-in-out infinite; }
    @keyframes chk { 50% { opacity: .95 } }
  </style>

  <rect width="1200" height="420" fill="#101114"/>
  <g clip-path="url(#bb)">
    <g stroke="#F2EFE6" stroke-opacity=".045">
      <path d="M0 47.5H1200M0 95H1200M0 142.5H1200M0 190H1200M0 237.5H1200M0 285H1200M0 332.5H1200"/>
      <path d="M47.5 0V376M95 0V376M142.5 0V376M190 0V376M237.5 0V376M285 0V376M332.5 0V376M380 0V376M427.5 0V376M475 0V376M522.5 0V376M570 0V376M617.5 0V376M665 0V376M712.5 0V376M760 0V376M807.5 0V376M855 0V376M902.5 0V376M950 0V376M997.5 0V376M1045 0V376M1092.5 0V376M1140 0V376"/>
    </g>

    <g fill="#D9FF43">
      <circle class="tw" cx="210" cy="70" r="2.6"/><circle class="tw d1" cx="420" cy="46" r="2"/>
      <circle class="tw d2" cx="640" cy="88" r="2.6"/><circle class="tw d3" cx="90" cy="250" r="2"/>
      <circle class="tw" cx="300" cy="320" r="2.2"/><circle class="tw d1" cx="540" cy="260" r="2"/>
      <circle class="tw d3" cx="700" cy="40" r="2.2"/><circle class="tw d2" cx="40" cy="150" r="2.2"/>
    </g>
    <g fill="#7C85FF">
      <circle class="tw d1" cx="160" cy="300" r="2.4"/><circle class="tw d2" cx="480" cy="150" r="2"/>
      <circle class="tw" cx="600" cy="330" r="2.4"/><circle class="tw d3" cx="360" cy="60" r="2"/>
    </g>

    <g class="ring"><circle cx="90" cy="84" r="40" fill="none" stroke="#4B57FF" stroke-width="2" stroke-dasharray="7 8"/></g>
    <g class="ring2"><circle cx="1128" cy="60" r="30" fill="none" stroke="#FFA86B" stroke-width="2" stroke-dasharray="6 7"/></g>

    <text x="64" y="108" fill="#D9FF43" font-size="17" font-weight="700" letter-spacing="6">SIDDHANT PARDESHI · SOFTWARE DEVELOPER</text>
    <text x="60" y="176" fill="#F2EFE6" font-size="56" font-weight="700">I build the logic.</text>
    <text x="60" y="240" fill="#F2EFE6" font-size="56" font-weight="700">You <tspan fill="#7C85FF">feel</tspan> the experience.</text>
    <path class="u" d="M158 258 q60 14 118 -2" fill="none" stroke="#D9FF43" stroke-width="7" stroke-linecap="round"/>
    <text x="64" y="292" fill="#A9ADB9" font-size="20">Full-stack Java · Spring Boot · MySQL · React — with a capybara guide named Byte.</text>

    <g>
      <rect x="64" y="318" width="204" height="40" rx="20" fill="#D9FF43"/>
      <text x="100" y="344" fill="#101114" font-size="16" font-weight="700">▶ View live site</text>
      <rect x="284" y="316" width="182" height="42" rx="21" fill="none" stroke="#F2EFE6" stroke-opacity=".55" stroke-width="2"/>
      <text x="312" y="343" fill="#F2EFE6" font-size="15" font-weight="600">Recruiter view</text>
    </g>

    <g class="bob">
      <g transform="translate(742 30) rotate(4)">
        <rect x="0" y="0" width="120" height="132" rx="10" fill="#F6F4EE" stroke="#101114" stroke-width="4"/>
        <rect x="8" y="8" width="104" height="92" rx="6" fill="url(#photo)"/>
        <text x="60" y="120" text-anchor="middle" fill="#101114" font-size="12" font-weight="700">That's me ✦</text>
      </g>
    </g>

    <g transform="translate(842 128)">
      <g class="breath">
        <path d="M-60 32 C-60 8 -44 -8 -14 -11 C14 -13.5 33 -8 45 2 C53 9 56 17 56 28 C56 52 53 66 44 68 L-46 68 C-56 66 -60 48 -60 32 Z" fill="#E9A566" stroke="#101114" stroke-width="4" stroke-linejoin="round"/>
        <g transform="translate(0 0)">
          <rect x="-66" y="6" width="30" height="42" rx="11" fill="#D9FF43" stroke="#101114" stroke-width="4"/>
          <rect x="-60" y="18" width="17" height="13" rx="5" fill="none" stroke="#101114" stroke-width="3"/>
        </g>
        <g>
          <ellipse cx="-28" cy="2" rx="10" ry="7.5" transform="rotate(-18 -28 2)" fill="#C9814C" stroke="#101114" stroke-width="3.4"/>
          <ellipse cx="8" cy="-4" rx="10" ry="7.5" transform="rotate(-6 8 -4)" fill="#C9814C" stroke="#101114" stroke-width="3.4"/>
        </g>
        <g class="blink">
          <circle cx="-10" cy="22" r="5.4" fill="#101114"/>
          <circle cx="24" cy="19" r="5.4" fill="#101114"/>
          <circle cx="-7.8" cy="20" r="1.7" fill="#fff"/>
          <circle cx="26.2" cy="17" r="1.7" fill="#fff"/>
        </g>
        <rect x="44" y="20" width="15" height="10" rx="5" fill="#2a1c12" stroke="#101114" stroke-width="2"/>
        <path d="M42 39 q6 5 12 1" fill="none" stroke="#101114" stroke-width="2.6" stroke-linecap="round"/>
        <ellipse class="cheek" cx="-16" cy="35" rx="7" ry="4.4" fill="#FF9E7D" opacity=".55"/>
        <g>
          <rect x="-12" y="46" width="40" height="36" rx="10" fill="#101114" stroke="#D9FF43" stroke-width="3"/>
          <rect x="-6" y="52" width="28" height="24" rx="6" fill="#1d2027"/>
          <g class="disp" fill="none" stroke="#D9FF43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 57 l-5 5 5 5 M14 57 l5 5 -5 5 M9 55 l-3.4 14"/>
          </g>
        </g>
        <rect x="-42" y="56" width="21" height="13" rx="6.5" fill="#E9A566" stroke="#101114" stroke-width="3.4"/>
        <rect x="-8" y="59" width="21" height="13" rx="6.5" fill="#E9A566" stroke="#101114" stroke-width="3.4"/>
        <rect x="22" y="59" width="21" height="13" rx="6.5" fill="#E9A566" stroke="#101114" stroke-width="3.4"/>
        <g class="paw"><rect x="36" y="51" width="22" height="14" rx="7" fill="#F0B273" stroke="#101114" stroke-width="3.4"/></g>
      </g>
      <path class="heart" d="M18 8 c-4.5,-3.8 -8,-6.6 -8,-9.6 a4.6,4.6 0 0 1 8,-1.8 a4.6,4.6 0 0 1 8,1.8 c0,3 -3.5,5.8 -8,9.6 z" fill="#FF7A6B"/>
      <path class="heart" style="animation-delay:1.7s" d="M36 2 c-4.5,-3.8 -8,-6.6 -8,-9.6 a4.6,4.6 0 0 1 8,-1.8 a4.6,4.6 0 0 1 8,1.8 c0,3 -3.5,5.8 -8,9.6 z" fill="#FF7A6B"/>
    </g>
  </g>

  <rect x="0" y="372" width="1200" height="3" fill="#4B57FF"/>
  <rect x="0" y="376" width="1200" height="44" fill="#D9FF43"/>
  <g class="tk" fill="#101114" font-size="17" font-weight="700" letter-spacing="2">
    <text x="0" y="405">JAVA ✦ SPRING BOOT ✦ MYSQL ✦ REACT ✦ REST APIs ✦ 4TH OVERALL · METRO HACKATHON ✦ GATE 2025 ✦ CGPA 8.13/10 ✦ TEAM URBANSYNC ✦</text>
    <text x="1250" y="405">JAVA ✦ SPRING BOOT ✦ MYSQL ✦ REACT ✦ REST APIs ✦ 4TH OVERALL · METRO HACKATHON ✦ GATE 2025 ✦ CGPA 8.13/10 ✦ TEAM URBANSYNC ✦</text>
  </g>
</svg>
