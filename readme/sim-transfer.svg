<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <style>
    .ttl { fill:#F2EFE6; font-size:22px; font-weight:700 }
    .sub { fill:#A9ADB9; font-size:13px }
    .box { fill:#1f2128; stroke:#F2EFE6; stroke-opacity:.35; stroke-width:2; rx:9 }
    .bt { fill:#F2EFE6; font-size:14px; font-weight:700; text-anchor:middle }
    .bs { fill:#8b8f9a; font-size:10px; text-anchor:middle }
    .lane { stroke:#4B57FF; stroke-width:2; stroke-dasharray:5 6; fill:none }
    .dot { fill:#D9FF43; stroke:#101114; stroke-width:2 }
    .bal { fill:#F2EFE6; font-size:19px; font-weight:700 }
    .blab { fill:#8b8f9a; font-size:10.5px; font-weight:700; letter-spacing:2 }
    .ok { fill:#D9FF43; font-size:15px; font-weight:700; letter-spacing:3 }
    .no { fill:#FF7A6B; font-size:15px; font-weight:700; letter-spacing:3 }
    .step { fill:#8b8f9a; font-size:11.5px }
    .amt { fill:#D9FF43; font-size:12px; font-weight:700 }
    /* COMMIT timeline: dot 4 stages 0-3.2s, commit 3.4s, hold to 7.5s, reset */
    .d1 { animation: tr1 7.6s ease-in-out infinite }
    @keyframes tr1 { 0% { transform: translate(0 0) } 24% { transform: translate(78px 0) } 48% { transform: translate(156px 0) } 72% { transform: translate(234px 0) } 80%,100% { transform: translate(234px 0) } }
    .c1 { animation: cm 7.6s ease-in-out infinite; opacity:0 }
    @keyframes cm { 0%,42% { opacity:0; transform: scale(1.6) } 50% { opacity:1; transform: scale(1) } 88% { opacity:1 } 96%,100% { opacity:0 } }
    .b1a { animation: ba 7.6s steps(1) infinite }
    @keyframes ba { 0%,43% { opacity:1 } 44%,100% { opacity:0 } }
    .b1a2 { animation: ba2 7.6s steps(1) infinite; opacity:0 }
    @keyframes ba2 { 0%,43% { opacity:0 } 44%,92% { opacity:1 } 93%,100% { opacity:0 } }
    .b1b { animation: bb 7.6s steps(1) infinite }
    @keyframes bb { 0%,45% { opacity:1 } 46%,100% { opacity:0 } }
    .b1b2 { animation: bb2 7.6s steps(1) infinite; opacity:0 }
    @keyframes bb2 { 0%,45% { opacity:0 } 46%,92% { opacity:1 } 93%,100% { opacity:0 } }
    .g1 { animation: ga 7.6s ease-out infinite; opacity:0 }
    @keyframes ga { 0%,46% { opacity:0; transform: scale(.6) } 54% { opacity:1; transform: scale(1) } 88% { opacity:1; transform: scale(1) } 94%,100% { opacity:0; transform: scale(.6) } }
    /* ROLLBACK timeline: dot travels, fails at MySQL ~2.8s, stamp, hold, reset */
    .d2 { animation: tr2 7.6s ease-in-out infinite }
    @keyframes tr2 { 0% { transform: translate(0 0) } 24% { transform: translate(78px 0) } 48% { transform: translate(156px 0) } 70% { transform: translate(234px 0) } 76%,100% { opacity:0; transform: translate(234px 0) } }
    .r1 { animation: ro 7.6s steps(1) infinite; opacity:0 }
    @keyframes ro { 0%,70% { opacity:0 } 71%,92% { opacity:1 } 93%,100% { opacity:0 } }
    .x1 { animation: xx 7.6s ease-in-out infinite; opacity:0 }
    @keyframes xx { 0%,64% { opacity:0; transform: scale(.4) } 70% { opacity:1; transform: scale(1) } 88% { opacity:1 } 93%,100% { opacity:0 } }
    .lane2 { animation: lf 7.6s steps(1) infinite }
    @keyframes lf { 0%,70% { stroke:#4B57FF } 71%,92% { stroke:#FF7A6B } 93%,100% { stroke:#4B57FF } }
    .step2 { animation: sf 7.6s steps(1) infinite }
    @keyframes sf { 0%,70% { fill:#8b8f9a } 71%,92% { fill:#FF7A6B } 93%,100% { fill:#8b8f9a } }
  </style>
  <rect width="980" height="560" fill="#101114"/>
  <text class="ttl" x="40" y="48">Playable backend — <tspan fill="#D9FF43">Follow a transfer</tspan></text>
  <text class="sub" x="40" y="72">Interactive on the site. Here's the loop it plays: one request, two balances, zero ambiguity.</text>

  <!-- COMMIT PANEL -->
  <g transform="translate(40 100)">
    <rect width="420" height="400" rx="14" fill="#17181d" stroke="#2a2c35"/>
    <text x="20" y="34" fill="#D9FF43" font-size="15" font-weight="700" letter-spacing="2">PATH 1 · SUCCESS → COMMIT</text>
    <g>
      <rect class="box" x="16" y="58" width="86" height="48" rx="9"/><text class="bt" x="59" y="80">Controller</text><text class="bs" x="59" y="95">receives request</text>
      <rect class="box" x="106" y="58" width="86" height="48" rx="9"/><text class="bt" x="149" y="80">Service</text><text class="bs" x="149" y="95">@Transactional</text>
      <rect class="box" x="196" y="58" width="86" height="48" rx="9"/><text class="bt" x="239" y="80">Repository</text><text class="bs" x="239" y="95">updates rows</text>
      <rect class="box" x="286" y="58" width="86" height="48" rx="9" stroke="#D9FF43"/><text class="bt" x="329" y="80">MySQL</text><text class="bs" x="329" y="95">commit / rollback</text>
      <path class="lane" d="M102 82 H106 M192 82 H196 M282 82 H286"/>
      <circle class="dot d1" cx="14" cy="82" r="7"/>
    </g>
    <text class="step" x="20" y="132">Controller receives <tspan fill="#F2EFE6">POST /transfers</tspan> · Service opens one all-or-nothing unit.</text>
    <g transform="translate(20 152)">
      <rect width="175" height="78" rx="10" fill="#1f2128" stroke="#2a2c35"/>
      <text class="blab" x="14" y="24">SENDER · ACCOUNT A</text>
      <text class="bal" x="14" y="52">₹12,400.00</text>
      <text class="bal b1a" x="14" y="52" fill="#D9FF43">₹11,900.00</text>
      <text class="bs" x="14" y="68">−₹500.00 on commit</text>
    </g>
    <g transform="translate(225 152)">
      <rect width="175" height="78" rx="10" fill="#1f2128" stroke="#2a2c35"/>
      <text class="blab" x="14" y="24">RECEIVER · ACCOUNT B</text>
      <text class="bal" x="14" y="52">₹8,750.00</text>
      <text class="bal b1b" x="14" y="52" fill="#D9FF43">₹9,250.00</text>
      <text class="bs" x="14" y="68">+₹500.00 on commit</text>
    </g>
    <text x="210" y="200" text-anchor="middle" class="amt">₹500 →</text>
    <g class="g1">
      <rect x="86" y="248" width="248" height="40" rx="20" fill="#D9FF43"/>
      <text class="ok" x="210" y="274" text-anchor="middle" fill="#101114">✓ COMMITTED — ATOMIC</text>
    </g>
    <text class="sub" x="20" y="318">Sender −₹500 and receiver +₹500 land as</text>
    <text class="sub" x="20" y="336">one unit. Any failure → both roll back.</text>
    <text class="sub" x="20" y="366" fill="#D9FF43" opacity=".8">@Transactional — the lesson the sim teaches.</text>
    <circle class="dot d1" cx="14" cy="82" r="7" opacity="0"/>
  </g>

  <!-- ROLLBACK PANEL -->
  <g transform="translate(520 100)">
    <rect width="420" height="400" rx="14" fill="#17181d" stroke="#2a2c35"/>
    <text x="20" y="34" fill="#FF7A6B" font-size="15" font-weight="700" letter-spacing="2">PATH 2 · SIMULATED FAILURE → ROLLBACK</text>
    <g>
      <rect class="box" x="16" y="58" width="86" height="48" rx="9"/><text class="bt" x="59" y="80">Controller</text><text class="bs" x="59" y="95">receives request</text>
      <rect class="box" x="106" y="58" width="86" height="48" rx="9"/><text class="bt" x="149" y="80">Service</text><text class="bs" x="149" y="95">@Transactional</text>
      <rect class="box" x="196" y="58" width="86" height="48" rx="9"/><text class="bt" x="239" y="80">Repository</text><text class="bs" x="239" y="95">in-flight debit</text>
      <rect class="box" x="286" y="58" width="86" height="48" rx="9"/><text class="bt" x="329" y="80">MySQL</text><text class="bs" x="329" y="95">✕ fails → rollback</text>
      <path class="lane lane2" d="M102 82 H106 M192 82 H196 M282 82 H286"/>
      <circle class="dot d2" cx="14" cy="82" r="7"/>
      <g class="x1"><circle cx="329" cy="82" r="26" fill="#FF7A6B" opacity=".18"/><path d="M319 72 l20 20 M339 72 l-20 20" stroke="#FF7A6B" stroke-width="4" stroke-linecap="round"/></g>
    </g>
    <text class="step step2" x="20" y="132">A simulated failure hits before commit — Spring rolls the whole transaction back.</text>
    <g transform="translate(20 152)">
      <rect width="175" height="78" rx="10" fill="#1f2128" stroke="#2a2c35"/>
      <text class="blab" x="14" y="24">SENDER · ACCOUNT A</text>
      <text class="bal" x="14" y="52">₹12,400.00</text>
      <text class="bs" x="14" y="68">unchanged — debit reverted</text>
    </g>
    <g transform="translate(225 152)">
      <rect width="175" height="78" rx="10" fill="#1f2128" stroke="#2a2c35"/>
      <text class="blab" x="14" y="24">RECEIVER · ACCOUNT B</text>
      <text class="bal" x="14" y="52">₹8,750.00</text>
      <text class="bs" x="14" y="68">unchanged — nothing arrived</text>
    </g>
    <g class="r1">
      <rect x="86" y="248" width="248" height="40" rx="20" fill="none" stroke="#FF7A6B" stroke-width="2"/>
      <text class="no" x="210" y="274" text-anchor="middle">⟲ ROLLBACK — NO HALF MOVES</text>
    </g>
    <text class="sub" x="20" y="318">Money can never vanish mid-flight: the transfer</text>
    <text class="sub" x="20" y="336">completes fully, or not at all.</text>
    <text class="sub" x="20" y="366" fill="#FF7A6B" opacity=".8">Try the failure button yourself on the live site.</text>
  </g>

  <text x="40" y="536" fill="#545863" font-size="12">Illustrative simulation — sample data. The real interactive version lives at siddhant-pardeshi.github.io → Work → BankNest.</text>
</svg>
